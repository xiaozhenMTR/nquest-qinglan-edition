<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QP 排行榜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            color: #1f2937;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; font-size: 32px; margin-bottom: 8px; color: #111827; }
        .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 32px; }

        /* ── 工具按钮区 ── */
        .claim-tools {
            display: flex; justify-content: center; gap: 12px;
            margin-bottom: 24px; flex-wrap: wrap;
        }
        .claim-toggle {
            background: #fff;
            border: 1px solid #e5e7eb;
            color: #374151; padding: 8px 20px; border-radius: 20px;
            font-size: 14px; cursor: pointer; transition: all .2s;
        }
        .claim-toggle:hover { background: #f3f4f6; }
        .btn-uuid-tool {
            display: inline-flex; align-items: center;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #ea580c; padding: 8px 20px; border-radius: 20px;
            font-size: 14px; text-decoration: none; transition: all .2s;
        }
        .btn-uuid-tool:hover { background: #ffedd5; }

        /* ── 认领面板 ── */
        .claim-panel {
            display: none; max-width: 520px; margin: 0 auto 30px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px; padding: 20px;
        }
        .claim-panel.show { display: block; }
        .claim-panel h3 { font-size: 16px; margin-bottom: 6px; color: #111827; }
        .claim-panel .tip { font-size: 12px; color: #6b7280; margin-bottom: 14px; line-height: 1.6; }
        .claim-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .claim-row input {
            flex: 1; padding: 8px 12px;
            background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 6px; color: #111827; font-size: 13px;
        }
        .claim-row input:focus { outline: none; border-color: #f7971e; }
        .claim-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .claim-actions button {
            padding: 7px 16px; border: none; border-radius: 6px;
            font-size: 13px; cursor: pointer;
        }
        .btn-claim { background: #f7971e; color: #fff; font-weight: 600; }
        .btn-claim:hover { background: #e8890b; }
        .btn-cancel { background: #f3f4f6; color: #6b7280; }
        .btn-cancel:hover { background: #e5e7eb; color: #374151; }
        .claim-msg { font-size: 13px; margin-top: 10px; }
        .claim-msg.ok { color: #16a34a; }
        .claim-msg.err { color: #dc2626; }

        /* ── 加载/错误 ── */
        .loading { text-align: center; padding: 60px 0; color: #6b7280; font-size: 16px; }
        .loading .spinner {
            display: inline-block; width: 32px; height: 32px;
            border: 3px solid #e5e7eb; border-top-color: #f7971e; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg {
            text-align: center; color: #dc2626;
            background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 8px; padding: 20px; margin: 20px 0;
        }

        /* ── 领奖台（第1名居中） ── */
        .top-3 {
            display: flex; justify-content: center; align-items: stretch;
            gap: 20px; margin: 20px 0 32px;
        }
        .podium-card {
            position: relative; text-align: center;
            flex: 1; max-width: 200px;
            border-radius: 14px; padding: 44px 14px 18px;
            border: 1px solid #e5e7eb;
        }
        .podium-card .medal {
            position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
            width: 26px; height: 26px; border-radius: 50%;
            color: #fff; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,.18);
        }
        .podium-card .medal::before, .podium-card .medal::after {
            content: ''; position: absolute; top: -9px; width: 8px; height: 13px;
            background: #3b82f6; z-index: -1;
        }
        .podium-card .medal::before { left: 5px; transform: rotate(-24deg); }
        .podium-card .medal::after { right: 5px; transform: rotate(24deg); }
        .podium-avatar {
            width: 64px; height: 64px; border-radius: 8px;
            image-rendering: pixelated; margin-bottom: 10px;
        }
        .podium-card .podium-name {
            font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .podium-card .podium-qp { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .podium-1 { background: #fffbeb; border-color: #fde68a; }
        .podium-1 .medal { background: #f59e0b; }
        .podium-1 .podium-qp { color: #ea580c; }
        .podium-2 { background: #eef1f6; border-color: #e5e7eb; }
        .podium-2 .medal { background: #94a3b8; }
        .podium-2 .podium-qp { color: #334155; }
        .podium-3 { background: #fff7ed; border-color: #fed7aa; }
        .podium-3 .medal { background: #b45309; }
        .podium-3 .podium-qp { color: #dc2626; }

        /* ── 列表 ── */
        .list-card {
            background: #fff; border: 1px solid #e5e7eb;
            border-radius: 14px; padding: 4px 24px 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .list-header {
            display: flex; align-items: center;
            padding: 16px 0 12px; border-bottom: 1px solid #f3f4f6;
            color: #6b7280; font-size: 14px;
        }
        .leaderboard { list-style: none; }
        .leaderboard .row {
            display: flex; align-items: center;
            padding: 13px 0; border-bottom: 1px solid #f9fafb;
        }
        .leaderboard .row:last-child { border-bottom: none; }
        .leaderboard .row:hover { background: #fafafa; }
        .rank-other { width: 44px; color: #9ca3af; font-size: 14px; font-weight: 600; flex-shrink: 0; }
        .avatar-img {
            width: 32px; height: 32px; border-radius: 6px;
            image-rendering: pixelated; flex-shrink: 0; margin-right: 14px;
        }
        .avatar-fallback {
            width: 32px; height: 32px; border-radius: 6px; background: #e5e7eb;
            color: #6b7280; font-size: 14px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-right: 14px;
        }
        .podium-fallback {
            width: 64px; height: 64px; font-size: 22px; border-radius: 8px;
            margin-right: 0; margin-bottom: 10px;
        }
        .row .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qp { font-size: 15px; font-weight: 700; color: #111827; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .footer { text-align: center; margin-top: 30px; color: #9ca3af; font-size: 12px; }
        .footer .update-time { color: #9ca3af; }
        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            h1 { font-size: 24px; }
            .top-3 { gap: 10px; }
            .podium-card { padding: 36px 8px 14px; }
            .podium-avatar { width: 48px; height: 48px; }
            .podium-fallback { width: 48px; height: 48px; }
            .leaderboard .row { padding: 11px 0; }
            .avatar-img, .avatar-fallback { width: 28px; height: 28px; }
            .qp { font-size: 14px; }
            .claim-tools { flex-direction: column; align-items: stretch; }
            .claim-toggle, .btn-uuid-tool { justify-content: center; text-align: center; }
            .claim-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QP 排行榜</h1>
    <p class="subtitle">Qinglan Quest</p>

    <div class="claim-tools">
        <button class="claim-toggle" id="claimToggle" onclick="toggleClaim()">🏷️ 认领我的 UUID</button>
        <a class="btn-uuid-tool" href="https://minecraft-serverlist.com/tools/offline-uuid" target="_blank" rel="noopener">🔗 游戏名转UUID</a>
    </div>

    <div class="claim-panel" id="claimPanel">
        <h3>认领 UUID</h3>
        <p class="tip">输入你的 UUID 和游戏名，提交后排行榜就会显示你的名字</p>
        <div class="claim-row">
            <input type="text" id="claimUuid" placeholder="UUID（如 b59e423d-8db7-3bbc-b18c-30f0eb7fa9fc）">
        </div>
        <div class="claim-row">
            <input type="text" id="claimName" placeholder="游戏名（如 Steve）" maxlength="16">
        </div>
        <div class="claim-actions">
            <button class="btn-cancel" onclick="toggleClaim(false)">取消</button>
            <button class="btn-claim" onclick="submitClaim()">认领</button>
        </div>
        <div class="claim-msg" id="claimMsg"></div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>加载排行榜中...</div>
    </div>
    <div id="error" class="error-msg" style="display:none;"></div>

    <div id="content" style="display:none;">
        <div id="podiumArea" class="top-3"></div>
        <div class="list-card">
            <div class="list-header">
                <span style="width:44px;flex-shrink:0;">排名</span>
                <span style="padding-left:46px;">玩家</span>
                <span style="margin-left:auto;">QP</span>
            </div>
            <ul class="leaderboard" id="leaderboardList"></ul>
        </div>
    </div>

    <div class="footer">
        <span class="update-time" id="updateTime"></span>
    </div>
</div>

<script>
/* ═══════════════════════ 认领面板 ═══════════════════════ */
function toggleClaim(force) {
    var panel = document.getElementById('claimPanel');
    var show = (force === undefined) ? !panel.classList.contains('show') : !!force;
    panel.classList.toggle('show', show);
    document.getElementById('claimMsg').textContent = '';
    if (show) document.getElementById('claimUuid').focus();
}

function setClaimMsg(text, ok) {
    var m = document.getElementById('claimMsg');
    m.textContent = text;
    m.className = 'claim-msg ' + (ok ? 'ok' : 'err');
}

async function submitClaim() {
    var uuid = document.getElementById('claimUuid').value.trim();
    var name = document.getElementById('claimName').value.trim();

    if (!uuid || !name) { setClaimMsg('请填写 UUID 和游戏名', false); return; }

    setClaimMsg('提交中...');
    try {
        var resp = await fetch('claim-name.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uuid: uuid, name: name })
        });
        var json = await resp.json();
        if (json.success) {
            setClaimMsg('✅ ' + json.message, true);
            document.getElementById('claimUuid').value = '';
            document.getElementById('claimName').value = '';
            setTimeout(function() { toggleClaim(false); }, 1200);
            loadLeaderboard();
        } else {
            setClaimMsg('认领失败: ' + (json.error || '未知错误'), false);
        }
    } catch (e) {
        setClaimMsg('网络错误: ' + e.message, false);
    }
}

/* ═══════════════════════ 数据加载 ═══════════════════════ */
const QP_URL = 'questqp.json';
const NAME_URL = 'uuidname.json';
let NAME_MAP = {};

async function loadNameMap() {
    try {
        const resp = await fetch(NAME_URL + '?t=' + Date.now());
        const json = await resp.json();
        if (json && typeof json === 'object') NAME_MAP = json;
    } catch (e) {
        NAME_MAP = {};
    }
}

function getDisplayName(uuid) {
    const key = uuid.replace(/-/g, '').toLowerCase();
    return NAME_MAP[key] || uuid.substring(0, 8);
}

async function loadQP() {
    const resp = await fetch(QP_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
}

function parseQP(json) {
    const entries = [];
    if (Array.isArray(json)) {
        json.forEach(function(item) { entries.push({ uuid: item.uuid, qp: item.qp || 0 }); });
    } else {
        for (var uuid in json) {
            if (json.hasOwnProperty(uuid)) entries.push({ uuid: uuid, qp: json[uuid] || 0 });
        }
    }
    entries.sort(function(a, b) { return b.qp - a.qp; });
    return entries;
}

/* ═══════════════════════ 渲染（第1名在中间） ═══════════════════════ */

/* 头像源：国内可达优先，失败自动切换下一个，全部失败显示首字母方块 */
const AVATAR_SOURCES = [
    function(n, s) { return 'https://vzge.me/face/' + s + '/' + encodeURIComponent(n); },
    function(n, s) { return 'https://minotar.net/avatar/' + encodeURIComponent(n) + '/' + s; },
    function(n, s) { return 'https://mc-heads.net/avatar/' + encodeURIComponent(n) + '/' + s; }
];

function avatarImg(name, size, cls) {
    return '<img class="' + cls + '" data-name="' + esc(name) + '" data-size="' + size + '" data-step="0"' +
        ' src="' + AVATAR_SOURCES[0](name, size) + '" onerror="avatarNext(this)" alt="">';
}

function avatarNext(img) {
    var step = parseInt(img.dataset.step || '0', 10) + 1;
    var name = img.dataset.name || '';
    if (step < AVATAR_SOURCES.length) {
        img.dataset.step = String(step);
        img.src = AVATAR_SOURCES[step](name, img.dataset.size || '32');
        return;
    }
    var span = document.createElement('span');
    span.className = img.className.indexOf('podium') !== -1
        ? 'avatar-fallback podium-fallback'
        : 'avatar-fallback';
    span.textContent = name.charAt(0).toUpperCase();
    img.replaceWith(span);
}

function fmt(n) { return Number(n).toLocaleString('en-US'); }

function renderPodium(top3) {
    const area = document.getElementById('podiumArea');
    if (top3.length === 0) { area.innerHTML = ''; return; }
    var order = top3.length >= 3 ? [1, 0, 2] : (top3.length === 2 ? [1, 0] : [0]);
    var html = '';
    order.forEach(function(idx) {
        var p = top3[idx];
        var rank = idx + 1;
        var name = getDisplayName(p.uuid);
        html +=
            '<div class="podium-card podium-' + rank + '">' +
                '<div class="medal">' + rank + '</div>' +
                avatarImg(name, 64, 'podium-avatar') +
                '<div class="podium-name" title="' + esc(name) + '">' + esc(name) + '</div>' +
                '<div class="podium-qp">' + fmt(p.qp) + '</div>' +
            '</div>';
    });
    area.innerHTML = html;
}

function renderList(players) {
    const list = document.getElementById('leaderboardList');
    let html = '';
    players.forEach(function(p, idx) {
        const rank = idx + 1;
        const name = getDisplayName(p.uuid);
        html +=
            '<li class="row">' +
                '<span class="rank-other">#' + rank + '</span>' +
                avatarImg(name, 32, 'avatar-img') +
                '<span class="name" title="' + esc(name) + '">' + esc(name) + '</span>' +
                '<span class="qp">' + fmt(p.qp) + '</span>' +
            '</li>';
    });
    list.innerHTML = html;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function loadLeaderboard() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('content').style.display = 'none';

    try {
        await loadNameMap();
        const json = await loadQP();
        const entries = parseQP(json);

        if (entries.length === 0) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '暂无排行榜数据';
            return;
        }

        renderPodium(entries.slice(0, 3));
        renderList(entries);

        const now = new Date();
        document.getElementById('updateTime').textContent =
            '更新于 ' + now.toLocaleString('zh-CN', { hour12: false });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = '加载失败: ' + e.message;
    }
}

loadLeaderboard();
</script>
</body>
</html>
