<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLQuest 任务管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            color: #1f2937;
            min-height: 100vh;
        }
        .page { max-width: 960px; margin: 0 auto; padding: 36px 20px 60px; }

        /* ── 页头 ── */
        .page-head { margin-bottom: 24px; }
        .page-head h1 { font-size: 26px; color: #111827; }
        .page-head p { color: #9ca3af; font-size: 14px; margin-top: 4px; }

        /* ── 工具栏 ── */
        .panel {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 16px 20px; display: flex; gap: 12px; align-items: center;
            flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.04); margin-bottom: 24px;
        }
        .panel input[type="password"] {
            width: 220px; padding: 9px 14px; border: 1px solid #e5e7eb;
            background: #f9fafb; border-radius: 8px; font-size: 14px; color: #111827;
        }
        .panel input[type="password"]:focus { outline: none; border-color: #f7971e; background: #fff; }
        .btn {
            padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1px solid transparent; transition: all .15s;
        }
        .btn-primary { background: #f7971e; color: #fff; }
        .btn-primary:hover { background: #e8890b; }
        .btn-outline { background: #fff; border-color: #e5e7eb; color: #374151; }
        .btn-outline:hover { border-color: #f7971e; color: #ea580c; background: #fff7ed; }
        .btn-danger-outline { background: #fff; border-color: #fecaca; color: #dc2626; }
        .btn-danger-outline:hover { background: #fef2f2; border-color: #dc2626; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .status { font-size: 13px; color: #6b7280; }
        .status.ok { color: #16a34a; }
        .status.error { color: #dc2626; }

        /* ── 任务卡片网格 ── */
        .quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
        .quest-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
            padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
            transition: box-shadow .15s;
        }
        .quest-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
        .qc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
        .qc-top code {
            font-family: ui-monospace, Consolas, monospace; font-size: 12px;
            background: #f3f4f6; color: #6b7280; padding: 3px 8px; border-radius: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tag { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: #f3f4f6; color: #6b7280; flex-shrink: 0; }
        .tag-repeat { background: #eff6ff; color: #2563eb; }
        .qc-name { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 10px; word-break: break-all; }
        .qc-meta { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
        .qp-num { color: #ea580c; font-weight: 700; font-size: 15px; }
        .qc-actions { display: flex; gap: 8px; }

        .empty { display: none; text-align: center; color: #9ca3af; padding: 70px 0; font-size: 14px; }
        .empty .icon { font-size: 36px; margin-bottom: 10px; }

        /* ── 弹窗：固定头部/底部 + 可滚动主体 ── */
        .modal-mask {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(17,24,39,.45);
            justify-content: center; align-items: flex-start; padding: 40px 16px;
        }
        .modal-mask.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 16px; width: 640px; max-width: 100%;
            max-height: calc(100vh - 80px); display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,.25); overflow: hidden;
        }
        .modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0;
        }
        .modal-head h2 { font-size: 17px; color: #111827; }
        .modal-close {
            width: 32px; height: 32px; border: none; border-radius: 8px;
            background: #f3f4f6; color: #6b7280; font-size: 17px; cursor: pointer; line-height: 1;
        }
        .modal-close:hover { background: #fee2e2; color: #dc2626; }
        .modal-body { padding: 20px 24px; overflow-y: auto; }
        .modal-foot {
            display: flex; justify-content: flex-end; gap: 10px;
            padding: 14px 24px; border-top: 1px solid #f3f4f6; flex-shrink: 0; background: #fff;
        }

        /* ── 表单字段 ── */
        .field { margin-bottom: 16px; }
        .field-row { display: flex; gap: 12px; }
        .field-row .field { flex: 1; min-width: 0; }
        .f-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .field input, .field select {
            width: 100%; padding: 9px 12px; border: 1px solid #e5e7eb;
            background: #f9fafb; border-radius: 8px; font-size: 14px; color: #111827;
        }
        .field input:focus, .field select:focus { outline: none; border-color: #f7971e; background: #fff; }

        /* ── 步骤卡片（纵向布局，避免横向挤压） ── */
        .point-block {
            background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 10px; padding: 14px; margin-bottom: 10px;
        }
        .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .step-badge {
            font-size: 12px; font-weight: 700; color: #ea580c;
            background: #fff7ed; padding: 3px 10px; border-radius: 99px; flex-shrink: 0;
        }
        .step-head .point-code {
            width: 64px; padding: 5px 8px; border: 1px solid #e5e7eb; border-radius: 6px;
            font-size: 13px; background: #fff; text-align: center; color: #111827; flex-shrink: 0;
        }
        .step-head .point-code:focus { outline: none; border-color: #f7971e; }
        .step-del {
            margin-left: auto; width: 26px; height: 26px; border: none; border-radius: 6px;
            background: #fee2e2; color: #dc2626; font-size: 15px; cursor: pointer;
            line-height: 1; flex-shrink: 0;
        }
        .step-del:hover { background: #dc2626; color: #fff; }
        .point-bossbar {
            width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb;
            border-radius: 8px; font-size: 13px; background: #fff; color: #111827;
        }
        .point-bossbar:focus { outline: none; border-color: #f7971e; }
        .tgl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; cursor: pointer; margin-top: 10px; }
        .tgl input { accent-color: #f7971e; }
        .mtr-extra { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e5e7eb; }
        .mtr-extra.show { display: block; }
        .point-station {
            width: 100%; padding: 8px 12px; border: 1px solid #e5e7eb;
            border-radius: 8px; font-size: 13px; background: #fff; color: #111827;
        }
        .point-station:focus { outline: none; border-color: #f7971e; }
        .add-step-btn {
            width: 100%; padding: 10px; border: 1px dashed #d1d5db; border-radius: 10px;
            background: transparent; color: #6b7280; font-size: 14px; cursor: pointer; margin-top: 2px;
        }
        .add-step-btn:hover { border-color: #f7971e; color: #ea580c; background: #fff7ed; }

        @media (max-width: 600px) {
            .page { padding: 20px 12px 40px; }
            .field-row { flex-direction: column; gap: 0; }
            .panel input[type="password"] { width: 100%; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="page-head">
        <h1>QLQuest 任务管理后台</h1>
        <p>Qinglan Quest · 任务配置管理</p>
    </div>

    <div class="panel">
        <input type="password" id="passwordInput" placeholder="管理密码">
        <button class="btn btn-primary" onclick="loadQuests()">加载任务列表</button>
        <button class="btn btn-outline" onclick="openCreate()">＋ 新建任务</button>
        <span class="status" id="statusMsg"></span>
    </div>

    <div class="quest-grid" id="questGrid" style="display:none;"></div>
    <div class="empty" id="emptyState">
        <div class="icon">📋</div>
        暂无任务，点击上方「加载任务列表」获取，或「新建任务」创建
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modalTitle">新建任务</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="field">
                <label class="f-label">任务 ID</label>
                <input type="text" id="editQuestId" placeholder="例如 explore_south_s1">
            </div>
            <div class="field">
                <label class="f-label">任务名称</label>
                <input type="text" id="editQuestName" placeholder="例如 Explore South Season 1">
            </div>
            <div class="field-row">
                <div class="field">
                    <label class="f-label">QP 奖励</label>
                    <input type="number" id="editQpReward" value="50" min="0">
                </div>
                <div class="field">
                    <label class="f-label">任务类型</label>
                    <select id="editType">
                        <option value="one_time">一次性</option>
                        <option value="repeatable">可重复</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label class="f-label">步骤</label>
                <div id="pointsContainer"></div>
                <button class="add-step-btn" onclick="addPoint()">＋ 添加步骤</button>
                <datalist id="stationList"></datalist>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveQuest()">保存</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'quests-admin.php';
const MTR_STATIONS_URL = 'https://liyuzhen.cn/qinglan/mtr-api/stations';
let STATION_NAMES = [];

async function loadStations() {
    try {
        const resp = await fetch(MTR_STATIONS_URL);
        const json = await resp.json();
        const list = (json.data && Array.isArray(json.data.stations)) ? json.data.stations : [];
        STATION_NAMES = list.map(s => String(s.name || '')).filter(n => n !== '');
        document.getElementById('stationList').innerHTML =
            STATION_NAMES.map(n => '<option value="' + esc(n) + '"></option>').join('');
    } catch (e) {
        setStatus('MTR 站点列表加载失败（仍可手动输入完整站名）: ' + e.message, 'error');
    }
}
loadStations();

function password() {
    return document.getElementById('passwordInput').value;
}

function setStatus(msg, cls) {
    const s = document.getElementById('statusMsg');
    s.textContent = msg;
    s.className = 'status ' + (cls || '');
}

async function loadQuests() {
    setStatus('加载中...');
    try {
        const resp = await fetch(API_URL + '?password=' + encodeURIComponent(password()));
        if (resp.status === 401) { setStatus('密码错误', 'error'); return; }
        if (!resp.ok) { setStatus('请求失败: ' + resp.status, 'error'); return; }
        const data = await resp.json();
        renderCards(data);
        setStatus('已加载 ' + data.length + ' 个任务', 'ok');
    } catch (e) {
        setStatus('网络错误: ' + e.message, 'error');
    }
}

function renderCards(quests) {
    const grid = document.getElementById('questGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = '';
    if (!quests || quests.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    grid.style.display = 'grid';
    quests.forEach(q => {
        const pointCount = (q.points && Array.isArray(q.points)) ? q.points.length : 0;
        const typeBadge = q.type === 'repeatable'
            ? '<span class="tag tag-repeat">可重复</span>'
            : '<span class="tag">一次性</span>';
        const card = document.createElement('div');
        card.className = 'quest-card';
        card.innerHTML =
            '<div class="qc-top"><code>' + esc(q.questId) + '</code>' + typeBadge + '</div>' +
            '<div class="qc-name">' + esc(q.questName || '') + '</div>' +
            '<div class="qc-meta"><span class="qp-num">' + (q.qpReward || 0) + '</span> QP 奖励 · ' + pointCount + ' 个步骤</div>' +
            '<div class="qc-actions">' +
                '<button class="btn btn-outline btn-sm" onclick="openEdit(\'' + esc(q.questId) + '\')">编辑</button>' +
                '<button class="btn btn-danger-outline btn-sm" onclick="deleteQuest(\'' + esc(q.questId) + '\')">删除</button>' +
            '</div>';
        grid.appendChild(card);
    });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

let allQuests = [];

async function openCreate() {
    document.getElementById('editId').value = '';
    document.getElementById('editQuestId').value = '';
    document.getElementById('editQuestId').readOnly = false;
    document.getElementById('editQuestName').value = '';
    document.getElementById('editQpReward').value = '50';
    document.getElementById('editType').value = 'one_time';
    document.getElementById('modalTitle').textContent = '新建任务';
    document.getElementById('pointsContainer').innerHTML = '';
    addPoint();
    document.getElementById('modalOverlay').classList.add('show');
}

async function openEdit(questId) {
    try {
        const resp = await fetch(API_URL + '?password=' + encodeURIComponent(password()));
        allQuests = await resp.json();
    } catch (e) { setStatus('加载失败', 'error'); return; }

    const q = allQuests.find(function(item) { return item.questId === questId; });
    if (!q) { setStatus('任务不存在', 'error'); return; }

    document.getElementById('editId').value = questId;
    document.getElementById('editQuestId').value = questId;
    document.getElementById('editQuestId').readOnly = true;
    document.getElementById('editQuestName').value = q.questName || '';
    document.getElementById('editQpReward').value = q.qpReward || 0;
    document.getElementById('editType').value = q.type || 'one_time';
    document.getElementById('modalTitle').textContent = '编辑任务: ' + questId;

    const container = document.getElementById('pointsContainer');
    container.innerHTML = '';
    if (q.points && q.points.length > 0) {
        q.points.forEach(function(p) { addPoint(p.code, p.bossbarText, p.station, p.ride, p.teleport); });
    } else {
        addPoint();
    }
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

function addPoint(code, bossbarText, station, ride, teleport) {
    code = code || ((document.querySelectorAll('.point-block').length) + 1);
    bossbarText = bossbarText || '';
    station = station || '';
    ride = (ride === undefined || ride === null) ? true : !!ride;
    teleport = !!teleport;

    const container = document.getElementById('pointsContainer');
    const block = document.createElement('div');
    block.className = 'point-block';
    block.dataset.teleport = teleport ? '1' : '';
    block.innerHTML =
        '<div class="step-head">' +
            '<span class="step-badge">步骤</span>' +
            '<input type="number" class="point-code" value="' + code + '" min="1" title="步骤 code">' +
            '<button class="step-del" title="删除此步骤" onclick="this.closest(\'.point-block\').remove()">×</button>' +
        '</div>' +
        '<input type="text" class="point-bossbar" value="' + esc(bossbarText) + '" placeholder="Bossbar 提示文本">' +
        '<label class="tgl"><input type="checkbox" class="point-mtr"' + (station ? ' checked' : '') + ' onchange="toggleMtr(this)"> 坐车进站</label>' +
        '<div class="mtr-extra' + (station ? ' show' : '') + '">' +
            '<label class="f-label">要到达的 MTR 站点</label>' +
            '<input type="text" class="point-station" list="stationList" value="' + esc(station) + '" placeholder="输入或选择要到达的 MTR 站点">' +
            '<label class="tgl" title="不勾选时必须乘坐列车到达该站；勾选后步行走进车站区域也算到达"><input type="checkbox" class="point-walk"' + (!ride ? ' checked' : '') + '> 步行进站也算</label>' +
        '</div>';
    container.appendChild(block);
}

function toggleMtr(cb) {
    cb.closest('.point-block').querySelector('.mtr-extra').classList.toggle('show', cb.checked);
}

function collectPoints() {
    const blocks = document.querySelectorAll('#pointsContainer .point-block');
    const points = [];
    blocks.forEach(function(block) {
        const code = parseInt(block.querySelector('.point-code').value) || 0;
        const bossbarText = block.querySelector('.point-bossbar').value.trim();
        const p = {
            code: code,
            bossbarText: bossbarText,
            teleport: block.dataset.teleport === '1'
        };
        if (block.querySelector('.point-mtr').checked) {
            p.station = block.querySelector('.point-station').value.trim();
            p.ride = !block.querySelector('.point-walk').checked;
        }
        points.push(p);
    });
    return points;
}

async function saveQuest() {
    const id       = document.getElementById('editQuestId').value.trim();
    const questName = document.getElementById('editQuestName').value.trim();
    const qpReward = parseInt(document.getElementById('editQpReward').value) || 0;
    const type     = document.getElementById('editType').value;
    const points   = collectPoints();

    if (!id)       { alert('请输入任务 ID'); return; }
    if (!questName) { alert('请输入任务名称'); return; }

    for (const p of points) {
        if (p.station !== undefined && !p.station) {
            alert('步骤 ' + p.code + ' 勾选了“坐车进站”，请填写要到达的站点');
            return;
        }
        if (p.station && STATION_NAMES.length > 0 && !STATION_NAMES.includes(p.station)) {
            if (!confirm('步骤 ' + p.code + ' 的站点 “' + p.station + '” 不在 MTR 站点列表中，任务可能无法触发。\n仍要保存吗？')) return;
        }
    }

    const body = {
        password: password(),
        action: 'save',
        id: id,
        data: {
            questId: id,
            questName: questName,
            qpReward: qpReward,
            type: type,
            points: points
        }
    };

    setStatus('保存中...');
    try {
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const json = await resp.json();
        if (json.success) {
            setStatus('保存成功', 'ok');
            closeModal();
            loadQuests();
        } else {
            setStatus('保存失败: ' + (json.error || '未知错误'), 'error');
        }
    } catch (e) {
        setStatus('网络错误: ' + e.message, 'error');
    }
}

async function deleteQuest(questId) {
    if (!confirm('确定删除任务 "' + questId + '" 吗？')) return;

    setStatus('删除中...');
    try {
        const resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                password: password(),
                action: 'delete',
                id: questId
            })
        });
        const json = await resp.json();
        if (json.success) {
            setStatus('已删除: ' + questId, 'ok');
            loadQuests();
        } else {
            setStatus('删除失败: ' + (json.error || '未知错误'), 'error');
        }
    } catch (e) {
        setStatus('网络错误: ' + e.message, 'error');
    }
}
</script>
</body>
</html>
