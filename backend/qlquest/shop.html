<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>称号兑换码生成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f6f8;
            color: #1f2937;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 520px; margin: 0 auto; }
        h1 { text-align: center; font-size: 28px; margin-bottom: 8px; color: #111827; }
        .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 30px; }
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px; padding: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 10px 14px;
            background: #f9fafb; border: 1px solid #e5e7eb;
            border-radius: 8px; color: #111827; font-size: 14px;
        }
        .field input:focus { outline: none; border-color: #f7971e; }
        .field .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        .btn-generate {
            width: 100%; padding: 12px;
            background: #f7971e;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: 700; color: #fff;
            cursor: pointer; transition: opacity .2s;
        }
        .btn-generate:hover { opacity: .85; }
        .btn-generate:disabled { opacity: .4; cursor: not-allowed; }
        .result {
            display: none; margin-top: 20px; padding: 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px; text-align: center;
        }
        .result.show { display: block; }
        .result .cdk-code {
            font-size: 28px; font-weight: 700; letter-spacing: 4px;
            color: #ea580c; margin: 10px 0; font-family: monospace;
        }
        .result .tip { font-size: 12px; color: #6b7280; }
        .error {
            color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center;
        }
        .price-tag {
            text-align: center; font-size: 18px; margin-bottom: 20px;
            color: #ea580c;
        }
        .price-tag small { font-size: 13px; color: #9ca3af; }
        .footer { text-align: center; margin-top: 30px; color: #9ca3af; font-size: 12px; }
        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            h1 { font-size: 22px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>称号兑换码生成</h1>
    <p class="subtitle">QLQuest Qinglan Edition</p>

    <div class="card">
        <div class="price-tag" id="priceDisplay">5000 <small>QP</small></div>

        <div class="field">
            <label>你的 UUID</label>
            <input type="text" id="uuidInput" placeholder="b59e423d-8db7-3bbc-b18c-30f0eb7fa9fc">
            <div class="hint">游戏内用 /qlquest qp 可查，或去游戏名转UUID工具查询</div>
        </div>

        <div class="field">
            <label>自定义称号名称</label>
            <input type="text" id="titleInput" placeholder="§e最强建筑工" maxlength="32">
            <div class="hint">支持 § 颜色代码，最大 32 字符</div>
        </div>

        <button class="btn-generate" id="genBtn" onclick="generateCdk()">生成兑换码</button>
        <div class="error" id="errorMsg"></div>

        <div class="result" id="resultBox">
            <div style="font-size:13px;color:#888;">兑换码（在游戏内使用 /qlquest redeem 兑换）</div>
            <div class="cdk-code" id="cdkCode">ABCDEFGH</div>
            <div class="tip">兑换后自动扣除 QP，称号立即生效</div>
        </div>
    </div>

    <div class="footer">
        <a href="index.html" style="color:#6b7280;text-decoration:none;">← 返回排行榜</a>
    </div>
</div>

<script>
const API_URL = 'cdk-api.php';

function setError(msg) {
    document.getElementById('errorMsg').textContent = msg;
}

async function generateCdk() {
    var uuid = document.getElementById('uuidInput').value.trim();
    var titleName = document.getElementById('titleInput').value.trim();

    if (!uuid) { setError('请输入 UUID'); return; }
    if (!titleName) { setError('请输入称号名称'); return; }

    document.getElementById('genBtn').disabled = true;
    document.getElementById('genBtn').textContent = '生成中...';
    setError('');
    document.getElementById('resultBox').classList.remove('show');

    try {
        var resp = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'generate',
                uuid: uuid,
                titleName: titleName
            })
        });
        var json = await resp.json();
        if (json.success) {
            document.getElementById('cdkCode').textContent = json.cdk;
            document.getElementById('resultBox').classList.add('show');
        } else {
            setError('生成失败: ' + (json.error || '未知错误'));
        }
    } catch (e) {
        setError('网络错误: ' + e.message);
    } finally {
        document.getElementById('genBtn').disabled = false;
        document.getElementById('genBtn').textContent = '生成兑换码';
    }
}
</script>
</body>
</html>
